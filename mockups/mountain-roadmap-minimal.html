<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mountain Roadmap Minimal</title>
  <style>
    :root {
      --bg: #f7f3ec;
      --paper: #fcfaf6;
      --ink: #1f1a17;
      --muted: #6d655e;
      --line: #d9d0c4;
      --accent: #b75533;
      --accent-soft: #f1d5c8;
      --gold: #d8a247;
      --shadow: 0 20px 50px rgba(31, 26, 23, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(circle at top, #fffdf8 0%, var(--bg) 60%);
      color: var(--ink);
    }

    .page {
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 32px 36px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .brand {
      font-size: 0.86rem;
      letter-spacing: 0.22rem;
      text-transform: uppercase;
      color: var(--muted);
    }

    .top-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .chip {
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.8);
      color: var(--muted);
      font-size: 0.92rem;
    }

    .canvas {
      background: rgba(255,255,255,0.62);
      border: 1px solid rgba(217, 208, 196, 0.9);
      border-radius: 32px;
      box-shadow: var(--shadow);
      min-height: 760px;
      padding: 26px;
      position: relative;
      overflow: hidden;
    }

    .canvas::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.8) 0%, transparent 18%),
        radial-gradient(circle at 50% 12%, rgba(216,162,71,0.08), transparent 20%);
      pointer-events: none;
    }

    .mountain-wrap {
      position: relative;
      width: 100%;
      height: 700px;
    }

    .mountain-label {
      position: absolute;
      left: 12px;
      bottom: 8px;
      color: var(--muted);
      font-size: 0.95rem;
      letter-spacing: 0.05rem;
    }

    .marker {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 10px;
      transform: translate(-50%, -50%);
    }

    .marker.reverse {
      flex-direction: row-reverse;
    }

    .dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: white;
      border: 3px solid var(--accent);
      box-shadow: 0 0 0 6px rgba(183, 85, 51, 0.10);
      flex: 0 0 auto;
    }

    .dot.current {
      background: var(--gold);
      border-color: var(--gold);
      box-shadow: 0 0 0 8px rgba(216, 162, 71, 0.16);
    }

    .dot.locked {
      background: #d7d0c8;
      border-color: #b8aea4;
      box-shadow: none;
    }

    .module {
      min-width: 180px;
      max-width: 220px;
      padding: 12px 14px;
      border-radius: 18px;
      background: rgba(255,255,255,0.94);
      border: 1px solid var(--line);
      box-shadow: 0 18px 28px rgba(31, 26, 23, 0.08);
    }

    .module strong {
      display: block;
      margin-bottom: 4px;
      font-size: 0.96rem;
    }

    .module span {
      display: block;
      color: var(--muted);
      font-size: 0.83rem;
      line-height: 1.45;
    }

    .module.current {
      border-color: rgba(216, 162, 71, 0.72);
      background: linear-gradient(180deg, #fffaf0 0%, #fff4dd 100%);
    }

    .module.locked {
      opacity: 0.62;
    }

    @media (max-width: 980px) {
      .page { padding: 18px; }
      .canvas { min-height: 640px; padding: 18px; }
      .mountain-wrap { height: 600px; }
      .module { min-width: 140px; max-width: 160px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar">
      <div class="brand">Camino</div>
      <div class="top-actions">
        <div class="chip">Taylor</div>
        <div class="chip">Neighbor Spanish</div>
        <div class="chip">Today's words: 4</div>
      </div>
    </div>

    <section class="canvas">
      <div class="mountain-wrap">
        <svg viewBox="0 0 1200 760" width="100%" height="100%" aria-hidden="true">
          <defs>
            <linearGradient id="peakLight" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#857d77" />
              <stop offset="100%" stop-color="#67605b" />
            </linearGradient>
            <linearGradient id="peakDark" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#5b5550" />
              <stop offset="100%" stop-color="#3f3a36" />
            </linearGradient>
          </defs>

          <path d="M180 640 L520 210 L720 470 L900 280 L1070 640 Z"
                fill="url(#peakDark)" />
          <path d="M180 640 L520 210 L610 640 Z"
                fill="url(#peakLight)" />
          <path d="M520 210 L590 318 L555 318 Z"
                fill="#f7f3ec" opacity="0.92" />
          <path d="M520 210 L590 318 L645 640 Z"
                fill="#4f4944" opacity="0.22" />

          <path d="M190 640
                   C 250 600, 300 560, 360 548
                   C 430 532, 470 498, 516 448
                   C 555 406, 606 388, 675 390
                   C 758 392, 812 354, 874 306"
                fill="none"
                stroke="#efe6d7"
                stroke-width="8"
                stroke-linecap="round"
                stroke-linejoin="round"
                opacity="0.95"/>
        </svg>

        <div class="marker reverse" style="left: 24%; top: 78%;">
          <div class="dot"></div>
          <div class="module">
            <strong>Hola vecino</strong>
            <span>Short introductions</span>
          </div>
        </div>

        <div class="marker" style="left: 39%; top: 64%;">
          <div class="dot current"></div>
          <div class="module current">
            <strong>Vida diaria</strong>
            <span>Family, routines, neighborhood basics</span>
          </div>
        </div>

        <div class="marker reverse" style="left: 54%; top: 49%;">
          <div class="dot"></div>
          <div class="module">
            <strong>Invitaciones</strong>
            <span>Plans and polite follow-ups</span>
          </div>
        </div>

        <div class="marker" style="left: 67%; top: 37%;">
          <div class="dot locked"></div>
          <div class="module locked">
            <strong>Problemas</strong>
            <span>Clarifying, asking for help</span>
          </div>
        </div>

        <div class="marker reverse" style="left: 78%; top: 23%;">
          <div class="dot locked"></div>
          <div class="module locked">
            <strong>Comfort</strong>
            <span>Longer natural exchanges</span>
          </div>
        </div>

        <div class="mountain-label">Your modules climb the mountain directly.</div>
      </div>
    </section>
  </main>
</body>
</html>
