<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Session Minimal</title>
  <style>
    :root {
      --bg: #f7f2ea;
      --paper: rgba(255, 252, 247, 0.92);
      --paper-strong: rgba(255, 252, 247, 0.98);
      --ink: #1f1916;
      --muted: #6f665f;
      --line: #ddd2c5;
      --accent: #b55231;
      --gold: #d8a247;
      --soft: #f1e7da;
      --shadow: 0 22px 55px rgba(31, 25, 22, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top, #fffdf9 0%, var(--bg) 62%);
    }

    .page {
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      padding: 26px 28px 30px;
    }

    .mountain-fade {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.08;
      transform: scale(1.05);
    }

    .mountain-fade svg {
      width: 100%;
      height: 100%;
    }

    .shell {
      position: relative;
      z-index: 1;
      max-width: 1240px;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 14px;
      min-height: calc(100vh - 56px);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .back {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.7);
      display: grid;
      place-items: center;
      font-size: 1.1rem;
      color: var(--muted);
    }

    .module-tag,
    .profile-tag,
    .audio-tag {
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.74);
      color: var(--muted);
      font-size: 0.92rem;
    }

    .chat-card {
      background: var(--paper-strong);
      border: 1px solid rgba(221, 210, 197, 0.95);
      border-radius: 30px;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
      min-height: 0;
    }

    .chat-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 16px 18px;
      border-bottom: 1px solid rgba(221, 210, 197, 0.82);
      background: rgba(255,255,255,0.72);
      flex-wrap: wrap;
    }

    .chat-meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .chat {
      padding: 22px;
      display: grid;
      gap: 14px;
      overflow: auto;
      align-content: start;
    }

    .bubble {
      max-width: 78%;
      padding: 15px 16px;
      border-radius: 20px;
      line-height: 1.55;
      font-size: 0.98rem;
    }

    .bubble.assistant {
      background: #fff9ef;
      border: 1px solid rgba(221, 210, 197, 0.95);
    }

    .bubble.user {
      justify-self: end;
      background: linear-gradient(180deg, #bb5d39 0%, #9f4527 100%);
      color: white;
    }

    .composer {
      padding: 18px 20px 20px;
      border-top: 1px solid rgba(221, 210, 197, 0.88);
      display: grid;
      gap: 12px;
      background: rgba(255,255,255,0.78);
    }

    .input {
      width: 100%;
      border: 0;
      border-radius: 20px;
      background: white;
      box-shadow: inset 0 0 0 1px rgba(221, 210, 197, 0.95);
      padding: 16px 18px;
      font-size: 1rem;
      color: var(--ink);
    }

    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .subtle {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .send {
      border: 0;
      border-radius: 999px;
      padding: 14px 20px;
      background: linear-gradient(180deg, #be5c37 0%, #a34729 100%);
      color: white;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    @media (max-width: 860px) {
      .page {
        padding: 18px;
      }

      .bubble {
        max-width: 92%;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="mountain-fade" aria-hidden="true">
      <svg viewBox="0 0 1600 1000">
        <path d="M170 850 L650 190 L890 560 L1120 310 L1450 850 Z" fill="#3f3a36"></path>
        <path d="M170 850 L650 190 L770 850 Z" fill="#6d6660"></path>
        <path d="M650 190 L725 330 L685 330 Z" fill="#ffffff"></path>
        <path d="M215 836
                 C 312 784, 414 742, 486 676
                 C 554 614, 608 556, 662 488
                 C 724 410, 820 396, 944 404
                 C 1070 412, 1164 358, 1288 286"
              fill="none"
              stroke="#ffffff"
              stroke-width="12"
              stroke-linecap="round"
              opacity="0.75" />
      </svg>
    </div>

    <main class="shell">
      <div class="topbar">
        <div class="left">
          <div class="back">&#8592;</div>
          <div class="profile-tag">Taylor</div>
        </div>
        <div class="audio-tag">Read replies aloud</div>
      </div>

      <section class="chat-card">
        <div class="chat-topbar">
          <div class="chat-meta">
            <div class="module-tag">Vida diaria</div>
          </div>
        </div>

        <div class="chat">
          <div class="bubble assistant">
            Hola. Soy tu vecina nueva. Vivo en la casa azul. ¿Qué te gusta hacer en tu tiempo libre?
          </div>
          <div class="bubble user">
            Me gusta cocinar con mi familia y caminar en la calle.
          </div>
          <div class="bubble assistant">
            Qué bien. Yo también cocino mucho. ¿Qué comida te gusta preparar?
          </div>
        </div>

        <div class="composer">
          <input class="input" value="Me gusta preparar comida mexicana." />
          <div class="actions">
            <div class="subtle"></div>
            <button class="send">Send</button>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
