<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Conversational Spanish MVP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="logs-panel collapsed" id="logsPanel">
        <div class="logs-header">
          <h2>Logs</h2>
          <button id="toggleLogs">Show</button>
        </div>
        <div class="log-entries" id="logEntries"></div>
      </aside>
      <main class="chat-wrapper">
        <section class="onboarding-panel" id="onboardingPanel">
          <h1>Tell us about your learning goals</h1>
          <form id="onboardingForm">
            <label>
              Learning goal
              <input name="goal" placeholder="e.g., talk to coworkers" required />
            </label>
            <label>
              Preferred topic
              <input name="topic" placeholder="e.g., travel" />
            </label>
            <label>
              Weekly practice time (minutes)
              <input name="time" type="number" min="5" value="15" />
            </label>
            <label>
              Self-rating
              <select name="level">
                <option value="brand-new">Brand new</option>
                <option value="know a few words">Know a few words</option>
                <option value="getting comfortable">Getting comfortable</option>
                <option value="intermediate">Intermediate</option>
                <option value="chatty">Chatty</option>
              </select>
            </label>
            <button type="submit">Save & start chatting</button>
          </form>
        </section>

        <section class="chat-panel" id="chatPanel">
          <div class="chat-header">
            <div>
              <h2>Conversational practice</h2>
              <p id="sessionSummary">Waiting for your first message...</p>
            </div>
          </div>
          <div class="chat-history" id="chatHistory"></div>
          <div class="inline-hint" id="inlineHint" hidden>
            <strong>Needs work:</strong>
            <p id="hintText"></p>
          </div>
          <form class="message-form" id="messageForm">
            <textarea name="message" rows="2" placeholder="Write in Spanish..." required></textarea>
            <button type="submit">Send</button>
          </form>
        </section>
      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
